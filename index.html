const sectionTitle=(small,title,desc)=>`<div class="section-head"><div><div class="eyebrow" style="margin-bottom:8px">${small}</div><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div></div>`;
function appShell(body){return `<div class="shell"><aside class="sidebar ${ui.mobile?'show':''}"><div class="brand"><div class="brandmark">✳</div><div><div class="brand-name">THE NEXT STEP</div><div class="brand-sub">TRIIBE · IMPACT SEED</div></div></div><div class="navlabel">${B('交互式原型','INTERACTIVE PROTOTYPE')}</div><nav aria-label="Main navigation">${studentTabs().map(([p,title])=>`<button class="navitem ${ui.studentTab===p?'active':''}" data-student-tab="${p}">${ico(({application:'file',progress:'calendar',support:'message',budget:'wallet',final:'flag'})[p],19)}<span>${title}</span>${ui.studentTab===p?`<span class="arrow">●</span>`:''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="mini"><strong>${B('演示说明','Demo information')}</strong><br>${B('所有学生、项目、预算及结果均为虚构演示。不会提交真实申请、拨款或审批。','All people, projects and results are fictional. No real applications, approvals or funds are processed.')}</div><div style="height:14px"></div>${button(ico('reset',15)+' '+B('重置演示','Reset demo'),'reset','secondary tiny')}</div></aside><div class="main"><header class="topbar"><div class="top-left"><button class="button secondary tiny mobile-menu" data-act="mobile">${ico('menu',17)}</button><span class="top-title">${B('学生端','Student Portal')}</span>${badge('CONCEPT DEMO','gray')}</div><div class="top-actions"><button class="button secondary tiny" data-act="toggle-lang">${s.lang==='zh'?'EN':'中文'}</button></div></header><main class="content" id="page-content">${body}<footer class="footer"><span>THE NEXT STEP · TRIIBE IMPACT SEED · ${B('独立概念原型','Independent concept prototype')}</span><span>${B('不代表 TRIIBE 的实际合作承诺或真实试点成果','Not actual TRIIBE commitments, partnerships or outcomes')}</span></footer></main></div></div>`}
const monthData=[{title:['Month 1 · 计划与准备','Month 1 · Plan & Prepare'],tasks:[['与社区确认公开通知来源、核验人员和居民需求','Confirm public notice sources, staff reviewers and resident needs'],['与导师制定 AI 草稿核验清单和易读版式','Develop an AI draft verification checklist and accessible layout with a mentor'],['确认必要条件后开始准备','Begin preparations after required checks']]},{title:['Month 2 · 实施与学习','Month 2 · Implement & Learn'],tasks:[['制作信息卡，经工作人员核对后开展居民测试','Create information cards, obtain staff checks and test with residents'],['提交简短进度与费用记录','Submit short progress and spending records'],['需要时向本地协调员请求导师支持','Request local mentoring as needed']]},{title:['Month 3 · 评估与反思','Month 3 · Evaluate & Reflect'],tasks:[['根据居民反馈修改信息卡，整理核验记录与使用说明','Refine cards using resident feedback and document checks and instructions'],['提交成果、实际支出和反思','Submit outcomes, spending and reflection'],['自主选择后续发展方向','Choose an optional future pathway']]}];
function appLabel(){if(s.selected)return B('已入选（演示）','Selected (demo)');if(s.reviewSubmitted)return B('评审建议已记录','Review recorded');return B('审核中','Under review')}
function pilotLabel(){if(s.closed)return B('已结项','Closed');if(s.finalSubmitted)return B('已完成，待结项','Completed · closeout pending');if(!s.selected)return B('尚未启动','Not started');if(s.pilotMonth===0)return B('规划准备','Planning');return B('进行中：第 '+s.pilotMonth+' 月','Active · Month '+s.pilotMonth)}
const PATHS=[{id:'local',ic:'handshake',name:['本地继续','Continue locally'],desc:['探索本地公益伙伴、校园和导师的进一步支持','Explore ongoing local partner and campus support']},{id:'triibe',ic:'globe',name:['TRIIBE 连接','Explore TRIIBE links'],desc:['在自愿和符合条件的前提下探索后续学习与社区连接','Explore optional learning or community connections if appropriate']},{id:'revise',ic:'target',name:['调整再试','Revise and retry'],desc:['总结经验，缩小或改变试点目标','Reflect and modify the next project idea']},{id:'pause',ic:'pause',name:['暂停或退出','Pause or exit'],desc:['允许学生暂停，不以继续项目作为唯一的成功标准','Allow a pause without treating it as automatic failure']}];
function heading(kicker,title,desc,actions=''){return `<div class="section-head"><div><div class="eyebrow" style="margin-bottom:9px">${kicker}</div><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div>${actions?`<div class="btnrow">${actions}</div>`:''}</div>`}
const studentTabs=()=>[['application',B('申请与状态','Application')],['progress',B('项目进度','Progress')],['support',B('支持请求','Support')],['budget',B('预算记录','Budget')],['final',B('成果报告','Final Report')]];
function student(){return `<div class="eyebrow page-kicker">STUDENT PORTAL · CONCEPT DEMO</div>${heading('',B('我的 Seed Program','My Seed Program'),B('青年发起社区小试点，在导师与本地伙伴支持下学习组织行动、记录反馈并改进项目。以下为虚构示例。','A fictional youth-led community pilot: organize action, learn from feedback and refine an idea with mentoring and local partner support.'),'')}<div class="card" style="margin-top:18px"><div class="case-head"><div class="case-icon">${ico('book',26)}</div><div style="flex:1"><h3>${B('AI 社区信息小助手','AI Community Info Helper')}</h3><div class="muted small">${B('小林','Xiaolin')} · ${DATA.appId} · ${B('示例申请','Demo application')}</div></div></div><div class="summary-chips" style="margin-top:17px"><span class="chip">${B('申请资金','Funding requested')}: ${money(DATA.request)}</span><span class="chip">${B('项目上限','Project cap')}: ${money(DATA.cap)}</span><span class="chip">${B('试点状态','Pilot status')}: ${s.selected?pilotLabel():appLabel()}</span></div></div>${studentBody()}`}
const expenseCategories=[{id:'materials',zh:'学习与活动材料',en:'Learning and session materials'},{id:'promotion',zh:'活动宣传',en:'Promotion'},{id:'transport',zh:'运输',en:'Transportation'},{id:'other',zh:'其他',en:'Other'}];
const expenseTotal=()=>Math.round((s.expenses||[]).reduce((n,x)=>n+x.amount,0)*100)/100;
function expenseLedger(){const total=expenseTotal(),remaining=s.approvedBudget-total;return `<div class="card" style="margin-top:20px"><div class="little-title">EXPENSE DETAILS</div><h3>${B('花费明细','Expense details')}</h3><div class="summary-chips" style="margin:16px 0"><span class="chip">${B('累计支出','Total spent')}: ${money(total)}</span><span class="chip">${B('剩余预算','Remaining budget')}: ${money(remaining)}</span><span class="chip">${(s.expenses||[]).length} ${B('笔记录','entries')}</span></div>${remaining<0?`<div class="notice warn" style="margin-bottom:14px">${B('当前支出已超出批准预算，请与协调员沟通。','Spending exceeds the approved budget. Contact your coordinator.')}</div>`:''}${s.expenses?.length?`<div style="overflow-x:auto"><table class="metric-table"><thead><tr>${[B('日期','Date'),B('用途','Description'),B('类别','Category'),B('金额','Amount'),B('备注','Notes'),B('操作','Action')].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${[...s.expenses].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td style="white-space:nowrap">${h(x.date)}</td><td style="min-width:140px;overflow-wrap:anywhere">${h(x.item)}</td><td>${(()=>{const c=expenseCategories.find(c=>c.id===x.category);return c?B(c.zh,c.en):h(x.category)})()}</td><td style="white-space:nowrap">${money(x.amount)}</td><td style="min-width:100px;overflow-wrap:anywhere">${h(x.note)||'—'}</td><td>${button(B('删除','Delete'),'delete-expense','secondary tiny',`data-expense-id="${h(x.id)}"`)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="placeholder">${B('尚无花费记录。添加第一笔花费后，将在这里显示完整明细。','No expenses yet. Add your first expense to see the detailed log here.')}</div>`}</div>`}
const reportText=(key,label)=>`<div class="form-group"><label for="report-${key}">${label}</label><textarea id="report-${key}" data-report="${key}" maxlength="4000">${h(s.report?.[key]??'')}</textarea></div>`;
function studentBody(){if(ui.studentTab==='application')return `<div style="margin-top:24px"><div class="card"><div class="little-title">APPLICATION · ${DATA.appId}</div><h3>${B('我的项目想法','My project idea')}</h3><p style="margin-top:12px">${B('我想和 3 名同学一起，用 AI 帮助上海一个社区把较长的活动通知整理成简明步骤、易读摘要和大字版信息卡，让居民更容易找到时间、地点和报名方式。我们计划在 3 个月内选择 6 条经社区确认的公开通知，请工作人员核对 AI 整理的内容，再邀请约 10 位居民试用并反馈。我们希望获得导师对 AI 内容核验、易读设计和用户测试的指导。居民个人信息不会输入 AI 工具。','Three classmates and I want to use AI to turn long community event notices into clear steps, plain-language summaries and large-print information cards, helping residents find dates, locations and sign-up details. Over three months, we will work with one Shanghai community to select six approved public notices, have staff check every AI-assisted draft and invite around 10 residents to test the materials. We seek mentoring on AI content verification, accessible design and user testing. Residents’ personal information will not be entered into AI tools.')}</p><div class="divider"></div>${fieldPair(B('申请者','Applicant'),B('小林（21 岁）','Xiaolin (21)'))}${fieldPair(B('所在地区（虚构案例）','Location (fictional)'),'Shanghai')}${fieldPair(B('申请方式','Application type'),B('个人申请','Individual'))}${fieldPair(B('试点安排','Pilot plan'),B('3 个月，试做 6 条通知并开展居民测试','3 months, six notices and resident testing'))}${fieldPair(B('请求资金','Funding requested'),money(DATA.request))}${fieldPair(B('所需支持','Support needs'),B('中文导师（AI 内容核验与易读设计）+ 社区通知、内容审核与测试招募','Chinese-language mentoring (AI verification and accessible design) + community notices, staff review and resident recruitment'))}</div></div>`;
if(ui.studentTab==='progress'){if(!s.selected)return blocked(B('项目尚未进入试点阶段','Pilot not started'),B('入选后将在这里显示项目进度与下一步安排。','Your progress and next steps will appear here after selection.'),'student-progress',B('查看项目进度','View project progress'));const m=s.pilotMonth;return `<div class="grid2"><div class="card"><div class="little-title">THREE-MONTH STUDENT PILOT</div><h3>${B('我的试点进度','My pilot progress')}</h3><div class="progsteps" style="margin:18px 0">${monthData.map((x,i)=>`<div class="progstep ${(m===i+1)?'active':''}"><strong>${B('第 '+(i+1)+' 月','Month '+(i+1))}</strong><br><small>${x.title[s.lang==='zh'?0:1].split('·')[1]||''}</small><div style="margin-top:8px">${badge(m>i+1||s.finalSubmitted?B('已完成','Done'):m===i+1?B('进行中','Active'):B('待开始','Upcoming'),m===i+1?'dark':'gray')}</div></div>`).join('')}</div>${m===0?`<p class="muted">${B('模拟入选已记录；下一步是完成项目计划并启动试点。','Demo selection recorded. Complete planning before starting the pilot.')}</p>${button(B('启动模拟三个月试点','Start demo pilot'),'start-pilot')}`:`<div class="notice"><strong>${B('当前阶段','Current stage')}: ${monthData[Math.min(m-1,2)].title[s.lang==='zh'?0:1]}</strong><br>${monthData[Math.min(m-1,2)].tasks.map(x=>'• '+x[s.lang==='zh'?0:1]).join('<br>')}</div><div class="btnrow" style="margin-top:16px">${!s.finalSubmitted&&m<3?button(B('进入下一个模拟月份','Advance to next month'),'advance-month'):m>=3?button(B('填写最终报告','Open final report'),'student-final'):''}${button(B('请求帮助','Request support'),'student-support','secondary')}</div>`}</div><div class="card"><div class="little-title">PROGRESS UPDATE</div><h3>${B('阶段性进度记录','Monthly check-in')}</h3><p class="muted small" style="margin:9px 0 14px">${B('每月简单记录完成情况、困难和下一步。本地合作方能够查看这些信息。','A short update records activities, challenges and next steps for the local coordinator.')}</p>${s.finalSubmitted?`<div class="notice">${B('最终报告已提交。','Final report submitted.')}</div>`:`<div class="form-group"><label for="progress-done">${B('本阶段完成了什么？','What did you complete?')}</label><textarea id="progress-done" placeholder="${B('例如：完成 2 条通知的信息卡，并由社区人员核对','e.g. Prepared cards for two notices and had community staff verify them')}"></textarea></div><div class="form-group"><label for="progress-challenge">${B('遇到了什么困难？','What challenges arose?')}</label><textarea id="progress-challenge" placeholder="${B('例如：AI 草稿遗漏了报名截止时间，需要人工补充','e.g. An AI draft omitted the sign-up deadline and needed correction')}"></textarea></div><div class="form-group"><label for="progress-next">${B('下一步计划？','What is your next step?')}</label><textarea id="progress-next" placeholder="${B('例如：与导师完善核验清单，再邀请居民测试','e.g. Refine the verification checklist with a mentor before resident testing')}"></textarea></div>${button(B('提交进度更新','Save progress update'),'save-progress')}`}${s.progress.length?`<div class="divider"></div><div class="little-title">${B('已记录的更新','SAVED UPDATES')}</div>${s.progress.map(x=>`<div class="statusline"><div class="status-dot active"></div><div><strong>${B('第 '+x.month+' 月','Month '+x.month)}</strong><div class="small muted">${h(x.done)}</div></div></div>`).join('')}`:''}</div></div>`}
if(ui.studentTab==='support')return `<div class="split"><div class="card"><div class="little-title">SUPPORT REQUEST</div><h3>${B('向本地协调员寻求支持','Ask your local coordinator for help')}</h3><p class="muted small" style="margin-top:9px">${B('本地合作方会优先处理常规请求；只有需要额外授权或特殊资源时才可能联系 TRIIBE。','The local partner handles routine issues. Only exceptional support may be escalated.')}</p><div class="form-group"><label for="support-type">${B('支持类型','Support type')}</label><select id="support-type"><option value="Mentorship">${B('导师指导','Mentorship')}</option><option value="Local connections">${B('本地资源或校园连接','Local connections')}</option><option value="Budget question">${B('预算与费用问题','Budget question')}</option><option value="Other">${B('其他问题','Other')}</option></select></div><div class="form-group"><label for="support-desc">${B('具体需要什么帮助？','What support do you need?')}</label><textarea id="support-desc" placeholder="${B('例如：希望导师指导如何检查 AI 摘要的准确性','e.g. I would like guidance on checking AI summaries for accuracy')}"></textarea></div>${button(B('提交支持请求','Submit support request'),'submit-support','',s.selected?'':'disabled')} ${!s.selected?`<p class="footnote" style="margin-top:10px">${B('需要先完成模拟入选。','Demo selection required before requesting project support.')}</p>`:''}</div><div class="card"><div class="little-title">REQUEST HISTORY</div><h3>${B('我的支持记录','My support requests')}</h3>${s.requests.length?s.requests.map(x=>`<div class="statusline" style="align-items:start"><div class="status-dot ${x.status==='Resolved'?'active':''}"></div><div style="flex:1"><div class="btnrow" style="justify-content:space-between"><strong>${h(x.type)}</strong>${badge(x.status==='Resolved'?B('已处理','Resolved'):B('待处理','Pending'),x.status==='Resolved'?'':'amber')}</div><p class="small" style="margin:7px 0">${h(x.desc)}</p>${x.response?`<div class="notice">${B('本地协调员回复','Local coordinator response')}: ${h(x.response)}</div>`:''}</div></div>`).join(''):`<div class="placeholder" style="margin-top:15px"><p>${B('尚无支持请求。','No requests yet.')}</p><p class="footnote">${B('提交后会在本地管理端出现相同记录。','New requests will appear in local operations.')}</p></div>`}</div></div>`;
if(ui.studentTab==='budget')return `<div class="grid2" style="margin-top:24px;align-items:start"><div class="card"><div class="little-title">EXPENSE LOG</div><h3>${B('记录每一笔花费','Record each expense')}</h3><div class="grid2"><div class="form-group"><label for="expense-date">${B('日期','Date')}</label><input id="expense-date" type="date" value="${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-${String(new Date().getDate()).padStart(2,'0')}"></div><div class="form-group"><label for="expense-amount">${B('金额（¥）','Amount (¥)')}</label><input id="expense-amount" type="number" min="0.01" step="0.01" placeholder="0.00"></div></div><div class="form-group"><label for="expense-item">${B('具体用途','Expense description')}</label><input id="expense-item" maxlength="160" placeholder="${B('例如：印刷 20 份大字版社区信息卡','e.g. Printed 20 large-print community information cards')}"></div><div class="form-group"><label for="expense-category">${B('类别','Category')}</label><select id="expense-category">${expenseCategories.map(x=>`<option value="${x.id}">${B(x.zh,x.en)}</option>`).join('')}</select></div><div class="form-group"><label for="expense-note">${B('备注（选填）','Notes (optional)')}</label><textarea id="expense-note" maxlength="500" placeholder="${B('例如：购买数量、商家、收据编号','e.g. Quantity, vendor or receipt reference')}"></textarea></div>${button(B('添加花费','Add expense'),'add-expense')}<p class="footnote" style="margin-top:12px">${B('记录保存在当前浏览器中。','Records are saved in this browser.')}</p></div><div class="card"><div class="little-title">INITIAL PLAN</div><h3>${B('AI 社区信息小助手 · ¥2,000 试点预算','AI Community Info Helper · ¥2,000 pilot budget')}</h3><table class="metric-table" style="margin-top:13px"><thead><tr><th>${B('用途','Item')}</th><th>${B('计划','Planned')}</th></tr></thead><tbody>${[[B('AI 工具试用额度（估算）','AI tool trial allowance (estimate)'),300],[B('大字版信息卡与测试材料印刷','Large-print cards and test materials'),500],[B('社区访谈与测试交通','Travel for community interviews and testing'),600],[B('共创活动耗材','Co-design session supplies'),400],[B('预备金','Contingency'),200]].map(x=>`<tr><td>${x[0]}</td><td class="num">${money(x[1])}</td></tr>`).join('')}<tr><td><strong>${B('合计','Total')}</strong></td><td><strong>¥2,000</strong></td></tr></tbody></table></div></div>${expenseLedger()}`;
if(ui.studentTab==='final'){if(!s.selected)return blocked(B('需要先进入试点','Selection needed'),B('在展示项目成果之前，应先经过审核、选择与实施。','Review, selection and pilot delivery come before outcomes.'),'student-progress',B('查看项目进度','View project progress'));return `<div class="split"><div class="card"><div class="little-title">FINAL PILOT REPORT</div><h3>${B('我的项目成果与反思','My pilot outcomes and reflection')}</h3>${s.pilotMonth<3&&!s.finalSubmitted?`<div class="notice warn" style="margin-top:14px">${B('当前仍在第 '+s.pilotMonth+' 月。请先切换到第 3 个月，再提交最终报告。','The case is currently in Month '+s.pilotMonth+'. Advance to Month 3 before submitting a final report.')}</div>`:''}<p class="muted small" style="margin-top:14px">${B('用目标、实际行动与证据说明项目成果。未达到目标也可以记录原因和收获。','Describe your goals, actions and evidence. If a goal was not met, explain what happened and what you learned.')}</p>${reportText('goal',B('原本想解决什么问题？','What problem did you aim to address?'))}${reportText('activities',B('实际完成了什么？','What did you actually do?'))}<div class="form-group"><label for="report-people">${B('直接参与或服务人数（选填）','Direct participants or people served (optional)')}</label><input id="report-people" data-report="people" type="number" min="0" step="1" value="${h(s.report?.people??'')}"><p class="footnote" style="margin-top:6px">${B('按不重复的人数填写；不适用或没有可靠记录可留空。','Count unique people. Leave blank if not applicable or not reliably recorded.')}</p></div><div class="divider"></div><strong>${B('自定义成果指标（选填）','Custom outcome measures (optional)')}</strong><p class="footnote" style="margin-top:7px">${B('选择适合自己项目的指标，例如举办场次、完成修补件数或技能掌握人数。数字之外，也请说明产生了什么变化。','Choose measures relevant to your project, such as sessions held, items repaired or people gaining a skill. Explain the change behind the numbers.')}</p>${[0,1,2].map(i=>`<div style="padding:14px 0;border-bottom:1px solid var(--line)"><div class="grid2"><div class="form-group"><label for="metric-${i}-name">${B('指标名称','Measure')} ${i+1}</label><input id="metric-${i}-name" data-metric="${i}" data-key="name" value="${h(s.report?.metrics?.[i]?.name??'')}" maxlength="100"></div><div class="form-group"><label for="metric-${i}-unit">${B('单位','Unit')}</label><input id="metric-${i}-unit" data-metric="${i}" data-key="unit" value="${h(s.report?.metrics?.[i]?.unit??'')}" maxlength="30" placeholder="${B('人 / 次 / 件 / %','people / sessions / items / %')}"></div></div><div class="grid2">${['target','actual'].map(k=>`<div class="form-group"><label for="metric-${i}-${k}">${k==='target'?B('目标值','Target'):B('实际值','Actual')}</label><input id="metric-${i}-${k}" data-metric="${i}" data-key="${k}" type="number" min="0" step="any" value="${h(s.report?.metrics?.[i]?.[k]??'')}"></div>`).join('')}</div></div>`).join('')}${reportText('change',B('带来了什么变化？','What changed as a result?'))}${reportText('evidence',B('反馈与证据（选填）','Feedback and evidence (optional)'))}<p class="footnote">${B('可填写匿名反馈、观察记录，或照片、问卷结果的链接。','Include anonymous feedback, observations or links to photos and survey results.')}</p><div class="form-group"><label>${B('实际支出（来自花费记录）','Actual spending (from expense log)')}</label><div class="notice">${money(expenseTotal())}</div></div>${reportText('reflection',B('遇到的困难、学习与反思','Challenges, learning and reflection'))}${button(s.finalSubmitted?B('更新模拟报告','Update demo report'):B('提交最终报告','Submit final report'),'submit-final','',s.pilotMonth>=3?'':'disabled')}${s.finalSubmitted?`<div class="notice" style="margin-top:14px">${B('模拟成果已经提交。本地协调员仍需检查并完成结项。','Demo outcomes recorded. Local coordinator review and closeout remain.')}</div>`:''}</div><div class="card"><div class="little-title">AFTER THE PILOT</div><h3>${B('我希望接下来……','What would I like to do next?')}</h3><p class="muted small" style="margin-top:9px">${B('这些选择不自动触发资金、导师或 Fellowship 名额。','No pathway guarantees funding, mentoring or a Fellowship position.')}</p>${PATHS.map(x=>`<button class="group-node ${s.studentPath===x.id?'sel':''}" data-student-path="${x.id}" style="width:100%;margin-top:9px;text-align:left"><strong>${x.name[s.lang==='zh'?0:1]}</strong><small>${x.desc[s.lang==='zh'?0:1]}</small></button>`).join('')}<div class="notice" style="margin-top:14px">${B('后续回访应获得自愿同意。学生暂停项目不等同于试点失败。','Follow-up should be voluntary. Choosing to pause is not automatically a failure.')}</div></div></div>`}}
function blocked(title,desc,go,label){return `<div class="card" style="max-width:760px"><div class="icobg">${ico('clock',22)}</div><h3>${title}</h3><p class="muted" style="margin-top:11px">${desc}</p>${button(label+' '+ico('arrow',15),go)}</div>`}
function render(){document.documentElement.lang=s.lang==='zh'?'zh-CN':'en';document.title=(s.lang==='zh'?'TRIIBE 学生端':'TRIIBE Student Portal')+' · The Next Step';document.getElementById('app').innerHTML=appShell(student());}
function drawStay(){const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'})}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),3200)}
function handleAction(act,el){if(act==='add-expense'){const date=document.getElementById('expense-date').value,item=document.getElementById('expense-item').value.trim(),category=document.getElementById('expense-category').value,raw=document.getElementById('expense-amount').value,amount=Number(raw),note=document.getElementById('expense-note').value.trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!item||!raw||!Number.isFinite(amount)||amount<=0||Math.abs(amount*100-Math.round(amount*100))>0.00001){showToast(B('请填写日期、用途及有效金额（最多两位小数）','Enter a date, description and valid amount (up to two decimals)'));return}s.expenses=s.expenses||[];s.expenses.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),date,item,category,amount:Math.round(amount*100)/100,note});save();drawStay();showToast(B('花费已记录','Expense saved'));return}
if(act==='delete-expense'){if(!confirm(B('删除这笔花费记录？','Delete this expense?')))return;s.expenses=(s.expenses||[]).filter(x=>x.id!==el.dataset.expenseId);save();drawStay();return}
if(act==='mobile'){ui.mobile=!ui.mobile;render();return}
if(act==='toggle-lang'){s.lang=s.lang==='zh'?'en':'zh';save();drawStay();return}
if(act==='reset'){if(!confirm(B('确定重置所有演示操作？','Reset all demo actions?')))return;const lang=s.lang;s=initial();s.lang=lang;save();ui={role:'triibe',phase:2,month:1,caseStep:0,studentTab:'application',partnerTab:'applications',growth:'adjust',path:'local',mobile:false};page='student';history.replaceState(null,'','#student');render();window.scrollTo(0,0);showToast(B('演示已重置','Demo reset'));return}
if(act==='student-final'||act==='student-support'||act==='student-progress'){ui.studentTab=act==='student-final'?'final':act==='student-support'?'support':'progress';drawStay();return}
if(act==='start-pilot'){if(!s.selected){showToast(B('先确认模拟入选','Record selection first'));return}s.pilotMonth=1;s.pilotStatus='Active';save();drawStay();showToast(B('模拟试点开始：第 1 个月','Demo pilot started: Month 1'));return}
if(act==='advance-month'){if(!s.selected||s.pilotMonth<1||s.pilotMonth>=3)return;s.pilotMonth++;save();drawStay();showToast(B('已切换到试点第 '+s.pilotMonth+' 个月','Advanced to Month '+s.pilotMonth));return}
if(act==='save-progress'){if(!s.selected||s.pilotMonth<1||s.finalSubmitted)return;const done=document.getElementById('progress-done')?.value.trim(),challenge=document.getElementById('progress-challenge')?.value.trim(),next=document.getElementById('progress-next')?.value.trim();if(!done||!next){showToast(B('请填写已完成事项和下一步','Provide completed work and next steps'));return}s.progress.push({month:s.pilotMonth,done,challenge,next});save();drawStay();showToast(B('进度已记录，本地管理端可查看','Progress saved and visible to local coordinator'));return}
if(act==='submit-support'){if(!s.selected)return;const type=document.getElementById('support-type')?.value,desc=document.getElementById('support-desc')?.value.trim();if(!desc||desc.length<8){showToast(B('请具体说明需要什么支持','Describe your support need in more detail'));return}s.requests.push({id:'REQ-'+String(s.requests.length+1).padStart(3,'0'),type,desc,status:'Pending',response:''});save();drawStay();showToast(B('支持请求已提交，可在本地管理端处理','Request submitted; local team can respond'));return}
if(act==='submit-final'){if(!s.selected||s.pilotMonth<3)return;const r=s.report||{};if(!['goal','activities','change','reflection'].every(k=>r[k]?.trim())){showToast(B('请填写项目目标、完成情况、变化与反思','Complete goals, activities, changes and reflection'));return}if(r.people!==undefined&&r.people!==''&&(!Number.isInteger(Number(r.people))||Number(r.people)<0)){showToast(B('人数需为非负整数或留空','People count must be a nonnegative whole number or blank'));return}for(const m of r.metrics||[]){if(!m||!Object.values(m).some(v=>String(v??'').trim()))continue;if(!m.name?.trim()||!m.unit?.trim()||m.actual===undefined||m.actual===''||!Number.isFinite(Number(m.actual))||Number(m.actual)<0||(m.target!==undefined&&m.target!==''&&(!Number.isFinite(Number(m.target))||Number(m.target)<0))){showToast(B('请补全指标名称、单位及有效实际值，目标值可留空','Complete each measure name, unit and actual value; target is optional'));return}}s.outcome={...s.outcome,spend:expenseTotal(),reflection:r.reflection};s.finalSubmitted=true;s.pilotStatus='Completed';save();drawStay();showToast(B('成果报告已保存，等待结项审核','Report saved; closeout review pending'));return}
}
document.addEventListener('input',e=>{const n=e.target;if(n.dataset.report){s.report=s.report||{};s.report[n.dataset.report]=n.value;save()}if(n.dataset.metric!==undefined){s.report=s.report||{};s.report.metrics=s.report.metrics||[];const i=Number(n.dataset.metric);s.report.metrics[i]=s.report.metrics[i]||{};s.report.metrics[i][n.dataset.key]=n.value;save()}});
document.addEventListener('click',e=>{const scr=e.target.closest('[data-scroll]');if(scr){e.preventDefault();document.getElementById(scr.dataset.scroll)?.scrollIntoView({behavior:'smooth'});return}const selectors=[['role','role'],['phase','phase'],['month','month'],['case','caseStep'],['student-tab','studentTab'],['partner-tab','partnerTab'],['growth','growth'],['path','path'],['student-path',null],['score',null],['recommend',null]];for(const [attr,key] of selectors){const node=e.target.closest('[data-'+attr+']');if(node){const val=node.getAttribute('data-'+attr);if(attr==='student-path'){s.studentPath=val;save();drawStay()}else if(attr==='score'){s.reviewScores[val]=Number(node.dataset.n);save();drawStay()}else if(attr==='recommend'){s.reviewRecommendation=val;s.reviewSubmitted=false;save();drawStay()}else{ui[key]=(attr==='phase'||attr==='month'||attr==='case')?Number(val):val;drawStay()}return}}const button=e.target.closest('[data-act]');if(button)handleAction(button.dataset.act,button)});
render();
})();
</script>
</body>
</html>
